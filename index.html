<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Application</title>

<style>
body{
margin:0;
padding:20px;
background:#f2f4f7;
font-family:Arial,sans-serif;
}

.container{
max-width:420px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
color:#0b5ed7;
}

p{
text-align:center;
color:#555;
}

input{
width:100%;
padding:14px;
margin-top:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#0b5ed7;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h2>Credit Card Application</h2>

<p>Fill the form below</p>

<form action="success.html" method="GET">

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="email" placeholder="Email Address" required>

<button type="submit">
Submit Application
</button>

</form>

</div>

</body>
</html>
